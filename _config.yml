title: Cheng Chien 錢承
url: https://jamesqian1999.github.io
baseurl: ""
lang: en
description: Personal website of Cheng Chien, featuring research in machine learning, image compression, and multimodal large language models.
timezone: Asia/Taipei

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - docs
  - scripts
  - vendor
  - assets/img/prof_pic_color.png # Unused original portrait; keep in source only.

plugins:
  - jekyll-sitemap

navigation:
  - title: About
    url: /
  - title: Publications
    url: /publications/
  - title: CV
    url: /cv/

defaults:
  - scope:
      path: assets
    values:
      sitemap: false
